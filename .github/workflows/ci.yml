name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium-headless-shell
      - name: Browser suite against the production build
        run: |
          npm run preview &
          npx wait-on http://127.0.0.1:4173 --timeout 30000
          npm run test:browser
