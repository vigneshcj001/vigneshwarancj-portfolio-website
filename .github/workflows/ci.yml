name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Pinned: ubuntu-latest moves to Ubuntu 26, where `playwright --with-deps`
    # may not have system packages yet. Bump deliberately after checking.
    runs-on: ubuntu-24.04
    steps:
      # v5 actions run on Node 24; v4 targeted the deprecated Node 20 runtime.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium-headless-shell
      - name: Browser suite against the production build
        run: |
          npm run preview &
          npx wait-on http://127.0.0.1:4173 --timeout 30000
          npm run test:browser
